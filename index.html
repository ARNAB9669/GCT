<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCT Game controller Tester</title>
    <link rel="stylesheet" href="Ui/style.css">
</head>

<body>

    <div class="shell">
        <div class="left">
            <div class="left_top"></div>
            <div class="left_bottom">
                <nav>
                    <div id="GUI_toggle" class="nav_to_gui nav_active">
                        <h3>Gui</h3>
                    </div>
                    <div id="RAW_DATA_toggle" class="nav_to_raw_data">
                        <h3>RAW-Data</h3>
                    </div>
                </nav>
            </div>
        </div>
        <div class="right">
            <div class="right_top">
                <div class="right_top_left">
                    <div id="export" class="Export">Export</div>
                </div>
                <div class="right_top_right">
                    <div id="status" class="status disconnected ">Disconnected</div>
                </div>
            </div>

            <div class="right_bottom">
                <section id="gui">
                    <div class="bottom_left">

                        <div class="bottom_left_l1">
                            <div class="l1_left">
                                <div id="LB" class="l1_left_top"></div>
                                <div id="LT" class="l1_left_bottom"></div>
                            </div>

                            <div class="l1_middle">
                                <div id="Menu1" class="l1_middle_box"></div>
                                <div id="Menu2" class="l1_middle_box"></div>
                                <div id="Menu3" class="l1_middle_box"></div>
                                <div id="Menu" class="l1_middle_box"></div>
                            </div>
                            <div class="l1_right">
                                <div id="RB" class="l1_right_top"></div>
                                <div id="RT" class="l1_right_bottom"></div>

                            </div>
                        </div>
                        <div class="bottom_left_l2">
                            <div class="l2_left">
                                <div class="l2_left_axis_ring">
                                    <div id="L_JoyStick" class="l2_left_pointer_ring"></div>
                                </div>
                            </div>
                            <div class="l2_right">
                                <div class="l2_right_axis_ring">
                                    <div id="R_JoyStick" class="l2_right_pointer_ring"></div>
                                </div>
                            </div>
                        </div>
                        <div class="bottom_left_l3">
                            <div class="l3_left">
                                <div class="l3_left_top">
                                    <div id="Dpad_Up" class="dpad_1 dpad"></div>
                                </div>
                                <div class="l3_left_middle">
                                    <div id="Dpad_Left" class="dpad_2 dpad"></div>
                                    <div id="Dpad_Right" class="dpad_3 dpad"></div>
                                </div>
                                <div class="l3_left_bottom">
                                    <div id="Dpad_Down" class="dpad_4 dpad"></div>
                                </div>
                            </div>
                            <div class="l3_right">
                                <div class="l3_right_top">
                                    <div id="B_Y" class="ring1 ring">Y</div>
                                </div>
                                <div class="l3_right_middle">
                                    <div id="B_X" class="ring2 ring">X</div>
                                    <div id="B_B" class="ring3 ring">B</div>
                                </div>
                                <div class="l3_right_bottom">
                                    <div id="B_A" class="ring4 ring">A</div>
                                </div>
                            </div>
                        </div>
                        <div class="bottom_left_l4">
                            <div id="ML" class="l4_Button_left l4_Button"></div>
                            <div id="MR" class="l4_Button_right l4_Button"></div>
                        </div>
                        <div class="bottom_left_l5">
                            <button id="test_vibration">Vibrate</button>
                        </div>

                    </div>

                    <div class="bottom_right">
                        <div class="bottom_right_top">
                            <canvas class="3d_gyro" id="gyro"></canvas>
                            <!--Canvas will load via 3js-->
                        </div>
                        <div class="bottom_right_bottom">
                            <div class="right_l1">
                                <h1>Live Changing Values:-</h1>
                            </div>
                            <div id="Live_Delta" class="right_l2">
                                <!--inner html will load via js-->
                            </div>
                        </div>
                    </div>
                </section>

                <section id="raw-data" hidden>
                    <div class="raw_left">
                        <Div class="raw_left_l1">
                            <div class="raw_left_l1.1">
                                <div class="raw_left_l1.1.1">Left Axis:</div>
                                <div class="raw_left_l1.1.2"></div>
                            </div>
                            <div class="raw_left_l1.2">
                                <div class="raw_left_l1.2.1">Right Axis</div>
                                <div class="raw_left_l1.2.2"></div>
                            </div>
                        </Div>
                        <Div class="raw_left_l2">
                            <div class="raw_left_l2.1">
                                <div class="raw_left_l2.1.1">Dpad Left:</div>
                                <div class="raw_left_l2.1.2"></div>
                            </div>
                            <div class="raw_left_l2.2">
                                <div class="raw_left_l2.2.1">Dpad Right:</div>
                                <div class="raw_left_l2.2.2"></div>
                            </div>
                            <div class="raw_left_l2.3">
                                <div class="raw_left_l2.3.1">Dpad Up:</div>
                                <div class="raw_left_l2.3.2"></div>
                            </div>
                            <div class="raw_left_l2.4">
                                <div class="raw_left_l2.4.1">Dpad Bottom:</div>
                                <div class="raw_left_l2.4.2"></div>
                            </div>
                        </Div>
                        <Div class="raw_left_l3">
                            <div class="raw_left_l3.1">
                                <div class="raw_left_l3.1.1">Button X:</div>
                                <div class="raw_left_l3.1.2"></div>
                            </div>
                            <div class="raw_left_l3.2">
                                <div class="raw_left_l3.2.1">Button Y</div>
                                <div class="raw_left_l3.2.2"></div>
                            </div>
                            <div class="raw_left_l3.3">
                                <div class="raw_left_l3.3.1">Button A</div>
                                <div class="raw_left_l3.3.2"></div>
                            </div>
                            <div class="raw_left_l3.4">
                                <div class="raw_left_l3.4.1">Button B:</div>
                                <div class="raw_left_l3.4.2"></div>
                            </div>
                        </Div>
                        <Div class="raw_left_l4">
                            <div class="raw_left_l4.1">
                                <div class="raw_left_l4.1.1">Menu 1:</div>
                                <div class="raw_left_l4.1.2"></div>
                            </div>
                            <div class="raw_left_l4.2">
                                <div class="raw_left_l4.2.1">Menu 2:</div>
                                <div class="raw_left_l4.2.2"></div>
                            </div>
                            <div class="raw_left_l4.3">
                                <div class="raw_left_l4.3.1">Menu 3:</div>
                                <div class="raw_left_l4.3.2"></div>
                            </div>
                            <div class="raw_left_l4.4">
                                <div class="raw_left_l4.4.1">Menu 4:</div>
                                <div class="raw_left_l4.4.2"></div>
                            </div>
                        </Div>
                        <Div class="raw_left_l5">
                            <div class="raw_left_l5.1">
                                <div class="raw_left_l5.1.1">LB:</div>
                                <div class="raw_left_l5.1.2"></div>
                            </div>
                            <div class="raw_left_l5.2">
                                <div class="raw_left_l5.2.1"></div>
                                <div class="raw_left_l5.2.2"></div>
                            </div>
                        </Div>
                        <Div class="raw_left_l6">
                            <div class="raw_left_l6.1">
                                <div class="raw_left_l6.1.1">LT:</div>
                                <div class="raw_left_l6.1.2"></div>
                            </div>
                            <div class="raw_left_l6.2">
                                <div class="raw_left_l6.2.1">RT:</div>
                                <div class="raw_left_l6.2.2"></div>
                            </div>
                        </Div>
                    </div>

                    <div class="raw_right"></div>
                </section>

            </div>
        </div>
    </div>

    <script type="module" src="Logic/logic.js"></script>
    <script type="importmap">

</script>
</body>

</html>
